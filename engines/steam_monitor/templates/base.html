<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title | default("Steam Monitor") }}</title>
  <style>
    :root {
      --bg-outer: #0e141b;
      --bg-card: #1b2838;
      --bg-card-deep: #141d29;
      --bg-header: #171a21;
      --bg-panel: #16202d;
      --bg-panel-hover: #1f2e40;
      --border-subtle: rgba(102, 192, 244, 0.16);
      --border-strong: rgba(102, 192, 244, 0.34);
      --text-primary: #e8f1f8;
      --text-secondary: #b8c7d4;
      --text-muted: #7f94a8;
      --steam-blue: #66c0f4;
      --steam-blue-dark: #2a475e;
      --steam-green: #90ba3c;
      --steam-lime: #beee11;
      --steam-discount-bg: #4c6b22;
      --steam-gold: #f5c542;
      --steam-silver: #cfd8e3;
      --steam-bronze: #d98a4e;
      --steam-amber: #f5a623;
      --steam-red: #e05252;
      --steam-offline: #898989;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--bg-outer);
      color: var(--text-primary);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .steam-card {
      width: {{ card_width | default(760) }}px;
      max-width: 100%;
      background: linear-gradient(180deg, #1e2d3f 0%, var(--bg-card) 45%, var(--bg-card-deep) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
    }

    .accent-bar {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, var(--steam-blue), #3b82c4);
    }
    .accent-bar.ingame {
      background: linear-gradient(90deg, var(--steam-green), var(--steam-blue));
    }
    .accent-bar.ended {
      background: linear-gradient(90deg, #4f6f8f, var(--steam-blue));
    }
    .accent-bar.gold {
      background: linear-gradient(90deg, #f5c542, #f59e0b, var(--steam-blue));
    }
    .accent-bar.store {
      background: linear-gradient(90deg, var(--steam-blue), var(--steam-green));
    }

    .card-body {
      padding: 20px 22px;
    }

    .card-header {
      background: linear-gradient(180deg, #171a21 0%, #19222d 100%);
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .card-footer {
      background: rgba(14, 20, 27, 0.55);
      border-top: 1px solid rgba(102, 192, 244, 0.1);
      padding: 10px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Avatar + optional Steam avatar frame */
    .avatar-wrap {
      position: relative;
      width: 60px;
      height: 60px;
      flex-shrink: 0;
    }
    .avatar-wrap.sm {
      width: 40px;
      height: 40px;
    }
    .avatar-wrap.md {
      width: 52px;
      height: 52px;
    }
    .avatar-wrap.lg {
      width: 78px;
      height: 78px;
    }

    .avatar-box {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: linear-gradient(135deg, #2a475e 0%, #1b2838 100%);
      border: 2px solid var(--steam-blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-box.ingame {
      border-color: var(--steam-green);
      box-shadow: 0 0 12px rgba(144, 186, 60, 0.35);
    }
    .avatar-box.offline {
      border-color: #556270;
    }
    .avatar-box.away {
      border-color: var(--steam-amber);
    }

    .avatar-initial {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: #c7d5e0;
      user-select: none;
    }
    .avatar-wrap.sm .avatar-initial {
      font-size: 15px;
    }
    .avatar-wrap.lg .avatar-initial {
      font-size: 28px;
    }

    .avatar-img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-frame {
      position: absolute;
      top: -11%;
      left: -11%;
      width: 122%;
      height: 122%;
      z-index: 2;
      pointer-events: none;
      object-fit: contain;
    }

    /* Steam Cover with graceful CSS gradient fallback */
    .cover-box {
      position: relative;
      width: 100%;
      aspect-ratio: 460 / 215;
      border-radius: var(--radius-md);
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(102, 192, 244, 0.28), transparent 55%),
        radial-gradient(circle at 82% 80%, rgba(144, 186, 60, 0.18), transparent 50%),
        linear-gradient(135deg, #243b55 0%, #182838 55%, #111b27 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      gap: 4px;
    }
    .cover-fallback-tag {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(102, 192, 244, 0.72);
      font-weight: 700;
    }
    .cover-fallback-title {
      font-size: 14px;
      font-weight: 700;
      color: #dbe8f4;
      line-height: 1.25;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .cover-img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Badges & Pills */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      line-height: 1.3;
    }
    .badge-ingame {
      background: rgba(144, 186, 60, 0.18);
      color: #b8e954;
      border: 1px solid rgba(144, 186, 60, 0.45);
    }
    .badge-blue {
      background: rgba(102, 192, 244, 0.15);
      color: var(--steam-blue);
      border: 1px solid rgba(102, 192, 244, 0.35);
    }
    .badge-slate {
      background: rgba(143, 152, 160, 0.15);
      color: #b8c7d4;
      border: 1px solid rgba(143, 152, 160, 0.3);
    }
    .badge-gold {
      background: linear-gradient(135deg, rgba(245, 197, 66, 0.25), rgba(217, 138, 78, 0.18));
      color: #ffd866;
      border: 1px solid rgba(245, 197, 66, 0.55);
    }
    .badge-red {
      background: rgba(224, 82, 82, 0.18);
      color: #ff8a8a;
      border: 1px solid rgba(224, 82, 82, 0.45);
    }
    .badge-amber {
      background: rgba(245, 166, 35, 0.18);
      color: #ffd080;
      border: 1px solid rgba(245, 166, 35, 0.45);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot.ingame { background: var(--steam-green); box-shadow: 0 0 6px var(--steam-green); }
    .dot.online { background: var(--steam-blue); box-shadow: 0 0 6px var(--steam-blue); }
    .dot.away { background: var(--steam-amber); }
    .dot.offline { background: #6b7785; }

    .mono {
      font-family: "Cascadia Code", "JetBrains Mono", "Consolas", monospace;
      font-variant-numeric: tabular-nums;
    }
    .num {
      font-variant-numeric: tabular-nums;
    }
    .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--steam-blue);
      letter-spacing: 0.4px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(102, 192, 244, 0.28), transparent);
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <div class="steam-card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
